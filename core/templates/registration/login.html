{% extends "core/base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="mb-3">Log in</h4>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">Log In</button>
                </form>
                <p class="mt-3 text-center">New here? <a href="{% url 'signup' %}">Create an account</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
